name: sonar_qube integration in Action
on: push
jobs:
  job_sonar: 
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: set up java
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: code cioverage using sonarqube
        run: mvn -B verify sonar:sonar -Dsonar.projectkey=sonar-github-actions-demo_sonar-github-actions-demo -Dsonar.host.url=https://sonarcloud.io/ -Dsonar.organization=sonar-github-actions-demo -Dsonar.token=$SONAR_TOKEN
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
